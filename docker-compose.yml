services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ops -d ops"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    restart: on-failure
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
      TEST_DATABASE_URL: postgres://ops:ops@db:5432/ops_test
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      db: { condition: service_healthy }

  worker:
    restart: on-failure
    build: .
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgres://ops:ops@db:5432/ops
    depends_on:
      db: { condition: service_healthy }
      app: { condition: service_started }

volumes:
  pgdata:
